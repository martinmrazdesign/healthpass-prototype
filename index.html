            <div class="hp-pin-dot"></div>
            <div class="hp-pin-dot"></div>
            <div class="hp-pin-dot"></div>
            <div class="hp-pin-dot"></div>
          </div>
        </div>

          <button type="button" class="hp-key" data-digit="5">5</button>
          <button type="button" class="hp-key" data-digit="6">6</button>
          <button type="button" class="hp-key" data-digit="7">7</button>

  <!-- ============================ LOADING SCREEN ============================ -->
  <!-- Shown after a correct PIN, before the app appears — see css/loading-screen.css. -->

    <div class="hp-loading-icon">
      <img class="hp-loading-icon-base" src="svg/hp-loading-icon-base.svg?v=34" alt="">

  </div>

  <!-- ============================ APP SHELL ============================ -->
  <div id="hp-app-shell" style="display:none;">
    <div id="hp-spinner" style="display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;pointer-events:none;">
      <div style="width:24px;height:24px;border-radius:50%;border:2.5px solid rgba(29,59,42,0.15);border-top-color:#1D3B2A;animation:hp-spin 0.65s linear infinite;"></div>
    </div>
    <div id="hp-app"></div>

    <!-- QR share sheet — lives outside #hp-app so it survives page navigation
         (its content is filled in dynamically per-page by openQrModal()). -->
    <div id="qr-backdrop" onclick="closeQrModal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:149;opacity:0;"></div>
    <div id="qr-modal" style="display:none;position:fixed;left:0;right:0;bottom:0;max-width:412px;margin:0 auto;background:var(--app-base);border-radius:24px 24px 0 0;z-index:150;padding:32px;box-sizing:border-box;max-height:75vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.3s ease;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <div class="header" id="qr-modal-title" style="color:var(--app-text);"></div>
        <button onclick="closeQrModal()" style="width:40px;height:40px;border-radius:999px;background:var(--app-surface);border:none;cursor:pointer;padding:4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M5.29289 5.29289C5.68342 4.90237 6.31658 4.90237 6.70711 5.29289L12 10.5858L17.2929 5.29289C17.6834 4.90237 18.3166 4.90237 18.7071 5.29289C19.0976 5.68342 19.0976 6.31658 18.7071 6.70711L13.4142 12L18.7071 17.2929C19.0976 17.6834 19.0976 18.3166 18.7071 18.7071C18.3166 19.0976 17.6834 19.0976 17.2929 18.7071L12 13.4142L6.70711 18.7071C6.31658 19.0976 5.68342 19.0976 5.29289 18.7071C4.90237 18.3166 4.90237 17.6834 5.29289 17.2929L10.5858 12L5.29289 6.70711C4.90237 6.31658 4.90237 5.68342 5.29289 5.29289Z" fill="var(--app-text)"/>
          </svg>
        </button>
      </div>
      <div style="background:var(--app-surface);border-radius:24px;padding:16px;text-align:center;">
        <div id="qrcode-modal" style="display:flex;align-items:center;justify-content:center;min-height:316px;"></div>
      </div>
      <div style="margin-top:24px;text-align:center;">
        <div class="text regular" style="color:var(--gray-dark);margin-bottom:8px;">PIN code</div>
        <div id="qr-modal-pin" style="display:inline-flex;gap:8px;"></div>
        <div class="text regular" style="color:var(--gray-dark);margin-top:12px;font-size:13px;">Share this PIN with the person scanning the QR code</div>
      </div>
    </div>
  </div>

  <script src="js/qr-code-styling-1.6.0-rc.1.js?v=34"></script>
  <script src="js/data.js?v=34"></script>
  <script src="js/pin.js?v=34"></script>
  <script src="js/app.js?v=34"></script>
  <script src="js/launch-animation.js?v=34"></script>
  <script>
    /* animate=true (passed after a successful PIN check) cross-fades the PIN
       screen into the "Loading..." screen, holds there briefly to sell the
       idea of real data loading, then cross-fades into the freshly-booted
       app shell. animate is omitted/false for the "already unlocked this
       session" load path below, which should show the app instantly with no
       PIN/loading screen ever having been visible to fade from. */
    function hpCrossFade(from, to, toDisplay, onDone) {
      to.style.display = toDisplay;
      to.style.opacity = '0';
      to.style.transition = 'none';
      void to.offsetWidth; // force reflow so the opacity transition below actually animates

      from.style.transition = 'opacity 0.35s ease';
      to.style.transition = 'opacity 0.35s ease';
      from.style.opacity = '0';
      to.style.opacity = '1';

      setTimeout(function () {
        from.style.display = 'none';
        from.style.pointerEvents = 'none';
        if (onDone) onDone();
      }, 350);
    }

    window.hpUnlock = function (animate) {
      sessionStorage.setItem('hp_unlocked', '1');
      document.getElementById('hp-splash-screen').style.display = 'none';
      var body = document.getElementById('hp-body');
      var pinScreen = document.getElementById('hp-pin-screen');
      var loadingScreen = document.getElementById('hp-loading-screen');
      var appShell = document.getElementById('hp-app-shell');

      if (!animate) {
        window.hpBootApp();
        body.classList.remove('hp-pin-page');
        pinScreen.style.display = 'none';
        appShell.style.display = 'block';
        return;
      }

      hpCrossFade(pinScreen, loadingScreen, 'flex', function () {
        setTimeout(function () {
          window.hpBootApp();
          hpCrossFade(loadingScreen, appShell, 'block', function () {
            body.classList.remove('hp-pin-page');
          });
        }, 3000); // simulated load hold — long enough to read as real work, short enough not to drag
      });
    };

    function showSplashThenPin() {
      var splashScreen = document.getElementById('hp-splash-screen');
      var pinScreen = document.getElementById('hp-pin-screen');

      splashScreen.style.display = 'block';
      splashScreen.style.opacity = '1';
      splashScreen.style.transition = 'none';
      pinScreen.style.display = 'block';
      pinScreen.style.opacity = '0';
      pinScreen.style.pointerEvents = 'none';

      playLaunchAnimation(function () {
        splashScreen.style.transition = 'opacity 0.4s ease';
        splashScreen.style.opacity = '0';
        setTimeout(function () {
          splashScreen.style.display = 'none';
          pinScreen.style.transition = 'opacity 0.4s ease';
          pinScreen.style.pointerEvents = 'auto';
          pinScreen.style.opacity = '1';
          document.getElementById('hp-pin-content').classList.add('is-visible');
          initPinKeypad();
        }, 400);
      });
    }

    window.showPinScreen = function () {
      document.getElementById('hp-body').classList.add('hp-pin-page');
      document.getElementById('hp-app-shell').style.display = 'none';
      location.hash = '';
      showSplashThenPin();
    };

    function showPinScreenOnly() {
      var pinScreen = document.getElementById('hp-pin-screen');
      document.getElementById('hp-splash-screen').style.display = 'none';
      pinScreen.style.display = 'block';
      pinScreen.style.opacity = '1';
      pinScreen.style.pointerEvents = 'auto';
      document.getElementById('hp-pin-content').classList.add('is-visible');
      initPinKeypad();
    }

    // A link opened straight into a live demo (e.g. a QR code someone scans)
    // should land on the PIN screen immediately — skip the splash the one
    // time it'd just be friction, via ?skip=1.
    var skipSplashOnLoad = new URLSearchParams(location.search).has('skip');

    if (sessionStorage.getItem('hp_unlocked') === '1') {
      window.hpUnlock();
    } else if (skipSplashOnLoad) {
      showPinScreenOnly();
    } else {
      showSplashThenPin();
    }
  </script>
