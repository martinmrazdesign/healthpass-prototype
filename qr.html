<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthPass — Scan to open</title>
<style>
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: #f5f2eb;
    font-family: 'SF Pro Display', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px;
    text-align: center;
  }
  h1 { font-size: 28px; margin: 0; color: #0a3922; }
  p { margin: 0; color: #4b5563; font-size: 15px; }
  #qrcode { background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
  .url { font-size: 13px; color: #8a8f93; word-break: break-all; max-width: 320px; }
</style>
</head>
<body>
  <h1>healthpass</h1>
  <p>Scan to open the prototype on your phone</p>
  <div id="qrcode"></div>
  <div class="url">https://martinmrazdesign.github.io/healthpass-prototype/</div>

  <script src="js/qr-code-styling-1.6.0-rc.1.js?v=54"></script>
  <script>
    new QRCodeStyling({
      width: 280, height: 280, type: 'svg',
      data: 'https://martinmrazdesign.github.io/healthpass-prototype/?skip=1',
      dotsOptions: { color: '#000000', type: 'rounded' },
      cornersSquareOptions: { color: '#000000', type: 'extra-rounded' },
      cornersDotOptions: { color: '#000000', type: 'dot' },
      backgroundOptions: { color: '#ffffff' },
      image: 'svg/logo-healthpass.svg?v=54',
      imageOptions: { crossOrigin: 'anonymous', margin: 8, imageSize: 0.4, hideBackgroundDots: true },
    }).append(document.getElementById('qrcode'));
  </script>
</body>
</html>
